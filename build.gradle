// P4-2a FSR on lavapipe (CPU Vulkan; never the GPU), same ICD approach as the pack replay: a system lavapipe if installed,
// else the flatpak GL runtime's libvulkan_lvp.so in place through an ICD file under build/lvp.
// ./gradlew fsrReplay [-Pcapture=dir] [-Pgolden=check|update] [-Pdump=dir] [-Pforce16]; last line "# fsrreplay PASS|FAIL ..."
tasks.register('fsrReplay', JavaExec) {
	group = 'verification'
	description = 'FSR 3.1 through the JNI shim on lavapipe: synthetic scene pair + captured Navidson frame'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.upscaletest.FsrReplay'
	jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
	workingDir = projectDir
	def a = []
	['capture', 'golden', 'dump', 'mode'].each { k -> if (project.hasProperty(k)) a << "--${k}=${project.property(k)}" }
	if (project.hasProperty('force16')) a << '--force16'
	args a
	doFirst {
		if (!fsrLib.exists()) throw new GradleException('libiroh_fsr.so missing: run ./gradlew fsrNative')
		systemProperty 'iroh.fsr.lib', fsrLib.absolutePath
		def sys = ['/usr/share/vulkan/icd.d/lvp_icd.x86_64.json', '/usr/share/vulkan/icd.d/lvp_icd.json'].find { new File(it).exists() }
		def icd = null
		def ld = null
		if (sys != null) {
			icd = sys
		} else {
			def lvp = null
			new File('/var/lib/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64').eachDirRecurse { d ->
				def f = new File(d, 'libvulkan_lvp.so')
				if (lvp == null && f.exists() && d.listFiles().any { it.name.startsWith('libLLVM.so') }) lvp = f
			}
			if (lvp == null) throw new GradleException('no lavapipe found: install vulkan-swrast (owner) or a flatpak GL runtime')
			def dir = file("${buildDir}/lvp/lib")
			dir.mkdirs()
			lvp.parentFile.listFiles().findAll { it.name.startsWith('libLLVM.so') || it.name == 'libvulkan_lvp.so' }.each { src ->
				def link = new File(dir, src.name)
				link.delete()
				java.nio.file.Files.createSymbolicLink(link.toPath(), src.toPath())
			}
			def json = file("${buildDir}/lvp/lvp_icd.json")
			json.text = '{"file_format_version":"1.0.1","ICD":{"library_path":"' + new File(dir, 'libvulkan_lvp.so').absolutePath + '","api_version":"1.3.0"}}'
			icd = json.absolutePath
			ld = dir.absolutePath
		}
		environment 'VK_DRIVER_FILES', icd
		environment 'VK_ICD_FILENAMES', icd
		environment 'VK_LOADER_LAYERS_DISABLE', '~implicit~'
		if (ld != null) environment 'LD_LIBRARY_PATH', ld
		logger.lifecycle("fsrReplay: lavapipe ICD ${icd}")
	}
}

