// Lavapipe (CPU Vulkan; never the GPU) for offline Vulkan tests: a system lavapipe ICD if installed (vulkan-swrast),
// else the libvulkan_lvp.so of an installed flatpak GL runtime (system or user installation), used in place through an
// ICD file under build/lvp (nothing is installed). Shared by velocityGoldenTest, fsrReplay and upscaleGoldenTest.
def useLavapipe = { JavaExec t ->
	def sys = ['/usr/share/vulkan/icd.d/lvp_icd.x86_64.json', '/usr/share/vulkan/icd.d/lvp_icd.json'].find { new File(it).exists() }
	def icd = null
	def ld = null
	if (sys != null) {
		icd = sys
	} else {
		def lvp = null
		['/var/lib/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64',
		 System.getProperty('user.home') + '/.local/share/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64'].each { root ->
			def r = new File(root)
			if (lvp == null && r.isDirectory()) r.eachDirRecurse { d ->
				def f = new File(d, 'libvulkan_lvp.so')
				if (lvp == null && f.exists() && d.listFiles().any { it.name.startsWith('libLLVM.so') }) lvp = f
			}
		}
		if (lvp == null) throw new GradleException('no lavapipe found: install the vulkan-swrast package (owner) or a flatpak GL runtime')
		def dir = file("${buildDir}/lvp/lib")
		dir.mkdirs()
		lvp.parentFile.listFiles().findAll { it.name.startsWith('libLLVM.so') || it.name == 'libvulkan_lvp.so' }.each { src ->
			def link = new File(dir, src.name)
			link.delete()
			java.nio.file.Files.createSymbolicLink(link.toPath(), src.toPath())
		}
		def json = file("${buildDir}/lvp/lvp_icd.json")
		json.text = '{"file_format_version":"1.0.1","ICD":{"library_path":"' + new File(dir, 'libvulkan_lvp.so').absolutePath + '","api_version":"1.3.0"}}'
		icd = json.absolutePath
		ld = dir.absolutePath
	}
	t.environment 'VK_DRIVER_FILES', icd
	t.environment 'VK_ICD_FILENAMES', icd
	t.environment 'VK_LOADER_LAYERS_DISABLE', '~implicit~'
	if (ld != null) t.environment 'LD_LIBRARY_PATH', ld
	t.logger.lifecycle("${t.name}: lavapipe ICD ${icd}")
	// F-2b: synchronization validation for the harnesses that enable VK_LAYER_KHRONOS_validation themselves (as 4c's vkval does):
	// -Psyncval (or the task asking for it) writes build/vkval/<task>/vk_layer_settings.txt with validate_sync and points the layer at it.
	def sync = project.findProperty('syncval')
	// P2-3: -Pvalidate=gpuav = GPU-assisted validation (indirect-buffer / descriptor / buffer-address CONTENT checks) for the same
	// harnesses (core validation off, the layer's advice; the setting names are int-4c's V-0 gpuav set). VK_LOADER_LAYERS_ENABLE also
	// forces the layer onto harnesses that do not load it themselves (apiReplay): their messages go to stdout ("Validation Error"),
	// which tools/vkval-extra-gate.sh counts. -PvkvalSet.<setting>=<v> overrides one setting.
	if (project.findProperty('validate')?.toString() == 'gpuav') {
		def dir = file("${buildDir}/vkval/${t.name}")
		dir.mkdirs()
		def set = [validate_core: false, validate_sync: false, stateless_param: true, object_lifetime: true, thread_safety: true, unique_handles: true,
			gpuav_enable: true, gpuav_shader_instrumentation: true, gpuav_descriptor_checks: true, gpuav_post_process_descriptor_indexing: true,
			gpuav_buffer_address_oob: true, gpuav_buffers_validation: true, printf_enable: false,
			debug_action: 'VK_DBG_LAYER_ACTION_LOG_MSG', log_filename: 'stdout', report_flags: 'error', enable_message_limit: false]
		project.properties.each { pk, pv -> if (pk.startsWith('vkvalSet.')) set[pk.substring(9)] = pv }
		def settings = new File(dir, 'vk_layer_settings.txt')
		settings.text = '# generated by build.gradle useLavapipe (card P2-3), mode gpuav\n' + set.collect { kk, v -> "khronos_validation.${kk} = ${v}" }.join('\n') + '\n'
		t.environment 'VK_LAYER_SETTINGS_PATH', settings.absolutePath
		t.environment 'VK_LOADER_LAYERS_ENABLE', 'VK_LAYER_KHRONOS_validation'
		t.systemProperty 'ti.vkval', 'gpuav'
		t.logger.lifecycle("${t.name}: GPU-assisted validation on (${settings})")
	} else if (t.ext.has('syncval') ? t.ext.syncval : (sync != null && sync != 'false')) {
		def dir = file("${buildDir}/vkval/${t.name}")
		dir.mkdirs()
		def settings = new File(dir, 'vk_layer_settings.txt')
		settings.text = '# generated by build.gradle useLavapipe (card F-2b)\nkhronos_validation.validate_core = true\nkhronos_validation.validate_sync = true\n' +
			'khronos_validation.syncval_shader_accesses_heuristic = false\nkhronos_validation.enable_message_limit = false\n'
		t.environment 'VK_LAYER_SETTINGS_PATH', settings.absolutePath
		t.logger.lifecycle("${t.name}: synchronization validation on (${settings})")
	}
}

// UPLOAD-SYNC (RQ-R1-a): api-4 upload order per consumer type on lavapipe. ./gradlew uploadSyncRepro ; "# uploadsync PASS n/n".
// -Pmode=legacy = the pre-UPLOAD-SYNC path (negative control: wrong values + hazards; the harness line still says PASS when reproduced)
tasks.register('uploadSyncRepro', JavaExec) {
	group = 'verification'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.apitest.UploadSyncRepro'
	jvmArgs '-Xmx1g', '-Djava.awt.headless=true'
	if (project.findProperty('mode') == 'legacy') jvmArgs '-Diroh.api4.upload=preframe'
	ext.syncval = true // F-2b settings; the layer is forced on (HeadlessGpuDevice does not load it): messages on stdout "Validation Error"
	doFirst { useLavapipe(it); it.environment 'VK_LOADER_LAYERS_ENABLE', 'VK_LAYER_KHRONOS_validation' }
}

