// V-0: after every lavapipe task with validation on, group the layer's JSON messages by VUID (counts, first message,
// first debug region), print the top groups, and FAIL on any Error not covered by tools/vkval-allowlist.txt
// (lines "VUID | substring-or-* | reason"; an entry without a reason is rejected). Warnings are printed, not failed.
def vkvalParse = { File f ->
	def out = []
	if (!f.exists()) return out
	def cur = null
	f.eachLine('UTF-8') { l ->
		if (l == '{') cur = new StringBuilder()
		if (cur != null) cur.append(l).append('\n')
		if (l == '}' && cur != null) {
			try { out << new groovy.json.JsonSlurper().parseText(cur.toString()) }
			catch (e) { out << [Severity: 'Error', VUID: 'V0-UNPARSED-MESSAGE', MainMessage: cur.toString().take(300)] } // never under-report
			cur = null
		}
	}
	if (cur != null) out << [Severity: 'Error', VUID: 'V0-UNPARSED-MESSAGE', MainMessage: cur.toString().take(300)]
	out
}
def vkvalAllow = {
	def f = file('tools/vkval-allowlist.txt'); def r = []
	if (f.exists()) f.eachLine { l ->
		l = l.trim(); if (!l || l.startsWith('#')) return
		def p = l.split('\\|', 3).collect { it.trim() }
		if (p.size() < 3 || !p[2]) throw new GradleException("tools/vkval-allowlist.txt: entry without a written reason: ${l}")
		r << [vuid: p[0], sub: p[1], reason: p[2]]
	}
	r
}
def vkvalCheck = { JavaExec t ->
	def msgs = vkvalParse(t.ext.vkvalLog)
	def allow = vkvalAllow()
	def groups = [:]
	msgs.each { m ->
		def key = (m.VUID ?: m.MessageID ?: '?') + ' ' + (m.Severity ?: '?')
		def g = groups.get(key)
		if (g == null) {
			def a = allow.find { it.vuid == m.VUID && (it.sub == '*' || (m.MainMessage ?: '').contains(it.sub)) }
			g = [vuid: m.VUID ?: m.MessageID, sev: m.Severity, n: 0, fn: m.Function, msg: (m.MainMessage ?: '').replaceAll('\\s+', ' '), region: m.DebugRegion, allow: a]
			groups[key] = g
		}
		g.n++
	}
	def errs = groups.values().findAll { it.sev == 'Error' && it.allow == null }
	def allowed = groups.values().findAll { it.allow != null }
	def other = groups.values().findAll { it.sev != 'Error' && it.allow == null }
	def label = t.ext.vkvalLabel
	def total = msgs.size()
	def rc = t.executionResult.present ? t.executionResult.get().exitValue : -1
	def errN = errs.sum { it.n } ?: 0
	def ld = t.ext.vkvalLoader
	println "# vkval ${label} layer-loaded=${ld.enabled}x implicit-off=${ld.disabled.size()} mode=${t.ext.vkvalMode} messages=${total} errors=${errN} (${errs.size()} VUIDs) allowlisted=${allowed.sum { it.n } ?: 0} other=${other.sum { it.n } ?: 0} log=${t.ext.vkvalLog}"
	(errs.sort { -it.n } + other.sort { -it.n }).take(12).each { g ->
		println "#   ${g.sev} x${g.n} ${g.vuid} [${g.fn}]${g.region ? ' region=' + g.region : ''}: ${g.msg.take(300)}"
	}
	allowed.each { g -> println "#   allowlisted x${g.n} ${g.vuid}: ${g.allow.reason}" }
	if (ld.enabled == 0) throw new GradleException("${label}: validation was requested but the loader never enabled VK_LAYER_KHRONOS_validation (no VkInstance, or the layer is missing)")
	if (rc != 0) throw new GradleException("${label}: harness exited ${rc}" + (errN ? " and ${errN} validation errors" : ''))
	if (errN) throw new GradleException("${label}: ${errN} Vulkan validation errors in ${errs.size()} VUIDs (log ${t.ext.vkvalLog})")
}
tasks.withType(JavaExec).configureEach { t -> t.doLast { if (t.ext.has('vkvalLog')) vkvalCheck(t) } }

