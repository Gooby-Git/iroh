// P3-3 offline frame replay on lavapipe (CPU Vulkan; never the GPU). The Vulkan loader is restricted to a lavapipe ICD:
// a system one (vulkan-swrast) if installed, else the libvulkan_lvp.so of an installed flatpak GL runtime, used in place
// through an ICD file under build/lvp (nothing is installed). ./gradlew packReplay [-Ppack] [-Pfolder] [-Psize=WxH]
// [-Pcapture=dir] [-Pframes=N] [-Pdump] [-Pgolden=check|update]; last line "# replay PASS ...".
tasks.register('packReplay', JavaExec) {
	group = 'verification'
	description = 'Replay a pack frame (deferred/composite/final) on lavapipe against a captured or synthetic frame'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.packtest.PackReplay'
	jvmArgs '-Xmx4g', '-Djava.awt.headless=true'
	workingDir = projectDir
	def a = []
	['pack', 'folder', 'size', 'capture', 'frames', 'golden'].each { k ->
		if (project.hasProperty(k)) a << "--${k}=${project.property(k)}"
	}
	if (project.hasProperty('dump')) a << "--dump"
	if (project.hasProperty('post')) a << "--post"
	if (project.hasProperty('full')) a << "--full"
	if (project.hasProperty('roundtrip')) a << "--roundtrip"
	if (project.hasProperty('upscale')) a << "--upscale=" + project.property('upscale')
	args a
	doFirst {
		def sys = ['/usr/share/vulkan/icd.d/lvp_icd.x86_64.json', '/usr/share/vulkan/icd.d/lvp_icd.json'].find { new File(it).exists() }
		def icd = null
		def ld = null
		if (sys != null) {
			icd = sys
		} else {
			def lvp = null
			new File('/var/lib/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64').eachDirRecurse { d ->
				def f = new File(d, 'libvulkan_lvp.so')
				if (lvp == null && f.exists() && d.listFiles().any { it.name.startsWith('libLLVM.so') }) lvp = f
			}
			if (lvp == null) throw new GradleException('no lavapipe found: install the vulkan-swrast package (owner) or a flatpak GL runtime')
			def dir = file("${buildDir}/lvp/lib")
			dir.mkdirs()
			lvp.parentFile.listFiles().findAll { it.name.startsWith('libLLVM.so') || it.name == 'libvulkan_lvp.so' }.each { src ->
				def link = new File(dir, src.name)
				link.delete()
				java.nio.file.Files.createSymbolicLink(link.toPath(), src.toPath())
			}
			def json = file("${buildDir}/lvp/lvp_icd.json")
			json.text = '{"file_format_version":"1.0.1","ICD":{"library_path":"' + new File(dir, 'libvulkan_lvp.so').absolutePath + '","api_version":"1.3.0"}}'
			icd = json.absolutePath
			ld = dir.absolutePath
		}
		environment 'VK_DRIVER_FILES', icd
		environment 'VK_ICD_FILENAMES', icd
		environment 'VK_LOADER_LAYERS_DISABLE', '~implicit~'
		if (ld != null) environment 'LD_LIBRARY_PATH', ld
		logger.lifecycle("packReplay: lavapipe ICD ${icd}")
	}
}

