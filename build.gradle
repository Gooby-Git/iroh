// Lavapipe (CPU Vulkan; never the GPU) for offline Vulkan tests: the system lavapipe ICD (vulkan-swrast) when installed,
// else (with a log line) the libvulkan_lvp.so of an installed flatpak GL runtime used in place through an ICD file under
// build/lvp (nothing is installed). The harness classes still refuse any non-CPU device and cap their memory at 1 GiB.
// Shared by every lavapipe task (velocity, FSR, denoiser, api, pack and RT harnesses); the optional label names the task.
// V-0: -Pvalidate[=core|gpuav|bestpractices|off] (default core when the Khronos validation layer is installed) enables
// VK_LAYER_KHRONOS_validation through a generated build/vkval/<label>/vk_layer_settings.txt; every implicit layer is
// disabled; messages go to build/vkval/<label>/validation.jsonl; the task FAILS on any validation error not in
// tools/vkval-allowlist.txt (see vkvalCheck below). gpuav and bestpractices are opt-in passes, never combined with sync.
// V-0: the layer writes pretty JSON blocks ("{" ... "}" on lines of their own) to stdout; this moves them into the
// task's validation.jsonl and passes every other line through. (log_filename is opened with truncation by EVERY
// VkInstance, so harnesses with several instances overwrote each other's messages: measured in rtReplay.)
class VkvalSplitter extends OutputStream {
	final OutputStream pass; final File log; final ByteArrayOutputStream line = new ByteArrayOutputStream(); boolean inBlock
	VkvalSplitter(OutputStream pass, File log) { this.pass = pass; this.log = log }
	void write(int b) { line.write(b); if (b == 10) flushLine() }
	void flushLine() {
		def bytes = line.toByteArray(); line.reset()
		def t = new String(bytes, 'UTF-8')
		if (!inBlock && t == '{\n') inBlock = true
		if (inBlock) { log.append(t, 'UTF-8'); if (t == '}\n') inBlock = false } else pass.write(bytes)
	}
	void flush() { pass.flush() }
	void close() { if (line.size()) flushLine(); pass.flush() }
}
// V-0: VK_LOADER_DEBUG=warn on stderr: proves the validation layer loaded ("forced enabled") and which implicit layers
// were disabled; those loader lines are counted and swallowed, every other stderr line passes through.
class VkvalLoaderFilter extends OutputStream {
	final OutputStream pass; final ByteArrayOutputStream line = new ByteArrayOutputStream()
	int enabled; final Set<String> disabled = new TreeSet<>()
	VkvalLoaderFilter(OutputStream pass) { this.pass = pass }
	void write(int b) { line.write(b); if (b == 10) flushLine() }
	void flushLine() {
		def bytes = line.toByteArray(); line.reset()
		def t = new String(bytes, 'UTF-8')
		if (t.startsWith('[Vulkan Loader] WARNING | LAYER:')) {
			if (t.contains('"VK_LAYER_KHRONOS_validation" forced enabled')) enabled++
			def m = t =~ /Layer "([^"]+)" forced disabled/
			if (m.find()) disabled << m.group(1)
		} else if (!t.startsWith('WARNING: [Loader Message] Code 0 : Layer "VK_LAYER_KHRONOS_validation" forced enabled')) pass.write(bytes)
	}
	void flush() { pass.flush() }
	void close() { if (line.size()) flushLine(); pass.flush() }
}
def vkvalLayerJson = new File('/usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json')
def vkvalMode = {
	def p = project.findProperty('validate')
	if (p == null || p == '' || p == 'true') return vkvalLayerJson.exists() ? 'core' : 'off'
	p = p.toString()
	if (p == 'false' || p == 'off') return 'off'
	if (!(p in ['core', 'gpuav', 'bestpractices'])) throw new GradleException("-Pvalidate=${p}: expected core|gpuav|bestpractices|off")
	if (!vkvalLayerJson.exists()) throw new GradleException("-Pvalidate=${p}: ${vkvalLayerJson} missing (install vulkan-validation-layers)")
	return p
}
def useLavapipe = { JavaExec t, String label = null ->
	def sys = ['/usr/share/vulkan/icd.d/lvp_icd.x86_64.json', '/usr/share/vulkan/icd.d/lvp_icd.json'].find { new File(it).exists() }
	def icd = null
	def ld = null
	if (sys != null) {
		icd = sys
	} else {
		def lvp = null
		['/var/lib/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64',
		 System.getProperty('user.home') + '/.local/share/flatpak/runtime/org.freedesktop.Platform.GL.default/x86_64'].each { root ->
			def r = new File(root)
			if (lvp == null && r.isDirectory()) r.eachDirRecurse { d ->
				def f = new File(d, 'libvulkan_lvp.so')
				if (lvp == null && f.exists() && d.listFiles().any { it.name.startsWith('libLLVM.so') }) lvp = f
			}
		}
		if (lvp == null) throw new GradleException('no lavapipe found: install the vulkan-swrast package (owner) or a flatpak GL runtime')
		t.logger.lifecycle("${label ?: t.name}: no system lavapipe ICD, falling back to the flatpak runtime's ${lvp}")
		def dir = file("${buildDir}/lvp/lib")
		dir.mkdirs()
		lvp.parentFile.listFiles().findAll { it.name.startsWith('libLLVM.so') || it.name == 'libvulkan_lvp.so' }.each { src ->
			def link = new File(dir, src.name)
			link.delete()
			java.nio.file.Files.createSymbolicLink(link.toPath(), src.toPath())
		}
		def json = file("${buildDir}/lvp/lvp_icd.json")
		json.text = '{"file_format_version":"1.0.1","ICD":{"library_path":"' + new File(dir, 'libvulkan_lvp.so').absolutePath + '","api_version":"1.3.0"}}'
		icd = json.absolutePath
		ld = dir.absolutePath
	}
	t.environment 'VK_DRIVER_FILES', icd
	t.environment 'VK_ICD_FILENAMES', icd
	t.environment 'VK_LOADER_LAYERS_DISABLE', '~implicit~'
	t.environment 'MESA_VK_ABORT_ON_DEVICE_LOSS', '1'
	if (ld != null) t.environment 'LD_LIBRARY_PATH', ld
	def mode = vkvalMode()
	if (mode != 'off') {
		def dir = file("${buildDir}/vkval/${label ?: t.name}")
		dir.mkdirs()
		def log = new File(dir, 'validation.jsonl')
		log.delete()
		def k = 'khronos_validation.'
		def set = [
			validate_core: true, check_image_layout: true, check_command_buffer: true, check_object_in_use: true, check_query: true, check_shaders: true,
			stateless_param: true, object_lifetime: true, thread_safety: true, unique_handles: true,
			validate_sync: mode == 'core', syncval_shader_accesses_heuristic: false,
			gpuav_enable: mode == 'gpuav', gpuav_shader_instrumentation: mode == 'gpuav', gpuav_descriptor_checks: mode == 'gpuav',
			gpuav_post_process_descriptor_indexing: mode == 'gpuav', gpuav_buffer_address_oob: mode == 'gpuav', gpuav_validate_trace_ray: mode == 'gpuav',
			gpuav_buffers_validation: mode == 'gpuav',
			validate_best_practices: mode == 'bestpractices', validate_best_practices_amd: mode == 'bestpractices',
			printf_enable: false,
			debug_action: 'VK_DBG_LAYER_ACTION_LOG_MSG', log_filename: 'stdout', // a file is reopened (truncated) per VkInstance: see VkvalSplitter
			report_flags: mode == 'bestpractices' ? 'error,warn,perf' : 'error,warn',
			enable_message_limit: true, duplicate_message_limit: 10000,
			message_format_json: true, message_format_display_application_name: false,
			disables: '', enables: ''
		]
		def settings = new File(dir, 'vk_layer_settings.txt')
		settings.text = "# generated by build.gradle useLavapipe (card V-0), mode ${mode}\n" + set.collect { kk, v -> "${k}${kk} = ${v}" }.join('\n') + '\n'
		t.environment 'VK_LOADER_LAYERS_ENABLE', 'VK_LAYER_KHRONOS_validation'
		t.environment 'VK_LAYER_SETTINGS_PATH', settings.absolutePath
		t.ext.vkvalLog = log
		t.standardOutput = new VkvalSplitter(System.out, log)
		t.ext.vkvalLoader = new VkvalLoaderFilter(System.err)
		t.errorOutput = t.ext.vkvalLoader
		t.environment 'VK_LOADER_DEBUG', 'warn'
		t.ext.vkvalMode = mode
		t.ext.vkvalLabel = label ?: t.name
		t.ignoreExitValue = true   // vkvalCheck prints the validation digest even when the harness itself failed, then fails the task
	}
	t.logger.lifecycle("${label ?: t.name}: lavapipe ICD ${icd}; validation ${mode}")
}

// api 4 (card V-M1): GPU api exerciser on lavapipe (CPU Vulkan only, 1 GiB cap). ./gradlew apiReplay [-Pgolden=sha]
// lavapipe from the system ICD or, until vulkan-swrast is installed, the flatpak GL runtime through an ICD file under
// build/lvp (same approach as the pack replay in iroh-wt-p3; nothing is installed).
tasks.register('apiReplay', JavaExec) {
	group = 'verification'
	description = 'api 4 buffers/compute/targets/multiDrawIndirectCount on lavapipe against a CPU reference'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.apitest.ApiReplay'
	jvmArgs '-Xmx1g', '-Djava.awt.headless=true'
	if (project.hasProperty('golden')) jvmArgs "-Dgolden=${project.property('golden')}"
	doFirst { useLavapipe(it) }
}

