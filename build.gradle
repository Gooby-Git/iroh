tasks.register('nrdReplay', JavaExec) {
	group = 'verification'
	description = 'NRD RELAX/REBLUR/SIGMA through the JNI shim on lavapipe against a synthetic noisy scene'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.rttest.NrdReplay'
	jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
	workingDir = projectDir
	def a = []
	['golden', 'dump'].each { k -> if (project.hasProperty(k)) a << "--${k}=${project.property(k)}" }
	args a
	// INT-2: NRD is an optional NVIDIA component that this repo never fetches by itself: without the built library the
	// task is SKIPPED with the reason (not failed); build it on request with ./gradlew nrdNative
	onlyIf {
		if (!nrdLib.exists()) logger.lifecycle("nrdReplay: SKIPPED: ${nrdLib} not present (optional NVIDIA NRD component, build on request with ./gradlew nrdNative)")
		nrdLib.exists()
