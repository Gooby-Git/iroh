// P4-2a native FSR library (CI-style; not part of build): ./gradlew fsrNative [-PfsrArgs=--linux-only]
tasks.register('fsrNative', Exec) {
	group = 'build'
	description = 'Build libiroh_fsr (FidelityFX 1.1.4 FSR 3.1 + shim) with iroh-native/build-fsr.sh'
	workingDir = projectDir
	environment 'IROH_JAVA_HOME', System.getenv('IROH_JAVA_HOME') ?: '/usr/lib/jvm/java-21-openjdk'
	def a = ['./iroh-native/build-fsr.sh']
	if (project.hasProperty('fsrArgs')) a.addAll(project.property('fsrArgs').toString().split(' ') as List)
	commandLine a
}

def fsrLib = file('iroh-native/natives/linux-x64/libiroh_fsr.so')

// P4-2a pure upscaler parts (+ native jitter/phase/render-size cross-checks when the library is built).
// ./gradlew upscaleTest ; last line "# upscale PASS n/n"
tasks.register('upscaleTest', JavaExec) {
	group = 'verification'
	description = 'Jitter sequence, phase counts, mip bias, quality modes; compared with the SDK through the shim when built'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.upscaletest.UpscaleTest'
	jvmArgs '-ea'
	doFirst { if (fsrLib.exists()) systemProperty 'iroh.fsr.lib', fsrLib.absolutePath }
}

// P4-2a FSR on lavapipe. ./gradlew fsrReplay [-Pcapture=dir] [-Pgolden=check|update] [-Pdump=dir] [-Pforce16]
// last line "# fsrreplay PASS|FAIL ..."
tasks.register('fsrReplay', JavaExec) {
	group = 'verification'
	description = 'FSR 3.1 through the JNI shim on lavapipe: synthetic scene pair + captured Navidson frame'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.upscaletest.FsrReplay'
	jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
	workingDir = projectDir
	def a = []
	['capture', 'golden', 'dump', 'mode'].each { k -> if (project.hasProperty(k)) a << "--${k}=${project.property(k)}" }
	if (project.hasProperty('force16')) a << '--force16'
	args a
	doFirst {
		if (!fsrLib.exists()) throw new GradleException('libiroh_fsr.so missing: run ./gradlew fsrNative')
		systemProperty 'iroh.fsr.lib', fsrLib.absolutePath
		useLavapipe(it)
	}
}

