// P5-0: offline ray-tracing prototype on lavapipe (CPU Vulkan only, 1 GiB cap): voxel test scene meshed in Iroh's 16-byte
// terrain format, raster G-buffer, BLAS/TLAS from the raster vertex buffer, ray-query passes (sun, block light, GI +
// radiance cache, reflections, alpha test), temporal accumulation, composition, PNGs; each pass checked against a CPU
// reference path tracer. ./gradlew rtReplay [-Pstep=a..h|all] [-Pquick] ; images + metrics under build/rt ; last line
// "# rtreplay PASS n/n". Never touches a GPU (HeadlessGpuDevice refuses non-CPU devices).
tasks.register('rtReplay', JavaExec) {
	group = 'verification'
	description = 'P5-0 RT prototype on lavapipe against a CPU reference path tracer'
	dependsOn 'testClasses'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'dev.elemore.iroh.rttest.RtReplay'
	jvmArgs '-Xmx3g', '-Djava.awt.headless=true'
	workingDir = projectDir
	['step', 'quick', 'golden', 'frames', 'res', 'compact', 'out'].each { k -> if (project.hasProperty(k)) jvmArgs "-Drt.${k}=${project.property(k)}" }
	doFirst {
		useLavapipe(it, 'rtReplay')
		def fl = file('iroh-native/natives/linux-x64/libiroh_fsr.so')   // P5-1 step (i): the chain ends in FSR 3.1
		if (fl.exists()) systemProperty 'iroh.fsr.lib', fl.absolutePath
	}
}

